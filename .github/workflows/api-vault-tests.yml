name: JM API Vault tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check all API modules
        working-directory: api-vault
        run: |
          node --check server.js
          node --check shopping-providers.js
          node --check vehicle-providers.js
          node --check telepecas-provider.js
          node --check landed-cost.js
          node --check shopping-compare.js
      - name: Run offline tests
        working-directory: api-vault
        run: node --test tests/*.test.js
