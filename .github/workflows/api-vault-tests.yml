name: JM API Vault tests

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "api-vault/**"
      - ".github/workflows/api-vault-tests.yml"
  pull_request:
    paths:
      - "api-vault/**"
      - ".github/workflows/api-vault-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-vault/package-lock.json
      - name: Install dependencies
        working-directory: api-vault
        run: npm ci
      - name: Run unit tests
        working-directory: api-vault
        run: npm test
